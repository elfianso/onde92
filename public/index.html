<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prochain — tes départs en temps réel, partout</title>
<meta name="description" content="Prochain : bus, tram, métro, RER et trains autour de toi, en temps réel. Toute l'Île-de-France, la métropole lilloise et les trains SNCF dans toute la France : dans combien de minutes, et si tu as le temps de l'attraper.">
<meta property="og:title" content="Prochain — tes départs en temps réel">
<meta property="og:description" content="Bus, tram, métro, RER, trains : le prochain départ autour de toi, et si tu as le temps de l'attraper.">
<meta name="application-name" content="Prochain"><meta name="apple-mobile-web-app-title" content="Prochain"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f4f5f8">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
<link rel="preload" href="/data/n/networks.json" as="fetch" crossorigin>
<link rel="stylesheet" href="/vendor/maplibre/maplibre-gl.css">
<link rel="stylesheet" href="/prochain.css">
<script>
  (function(){try{var t=localStorage.getItem('onde-theme');if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t;document.querySelector('meta[name=theme-color]').content=t==='dark'?'#0e1117':'#f4f5f8';}catch(e){document.documentElement.dataset.theme='light';}
   var h=location.hash;if(/^#\/(ligne|arret|monbus)/.test(h))location.replace('/lignes.html'+h);})();
</script>
</head>
<body>
<div class="app" id="app" data-sheet="half">
  <div class="map-area">
    <div id="map" class="map" aria-label="Carte des lignes et des arrêts"></div>
    <div class="me-fixed pin" id="mePin" aria-hidden="true"><i></i><b></b></div>
    <div class="map-top">
      <a class="brand" href="/" aria-label="Prochain — accueil">
        <span class="brand-logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path class="p1" d="M6 6l6 6-6 6"/><path class="p2" d="M12.5 6l6 6-6 6" opacity=".7"/></svg></span><b>Prochain</b>
      </a>
      <div class="map-menu">
        <button class="fab" id="btnMore" type="button" aria-label="Menu" aria-haspopup="true" aria-expanded="false" title="Menu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h.01M12 12h.01M18 12h.01"/></svg>
        </button>
        <div class="menu" id="moreMenu" hidden role="menu">
          <button role="menuitem" id="btnTheme" type="button">
            <svg class="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
            <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/></svg>
            <span id="themeLbl">Mode sombre</span>
          </button>
          <button role="menuitem" id="btnSat" type="button" aria-pressed="false">
            <svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg>
            <span id="satLbl">Vue satellite</span>
          </button>
          <a role="menuitem" href="/lignes.html">
            <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h11"/></svg>
            Fiches des lignes 144 · 160 · 244 · 360
          </a>
          <p class="menu-note">Données ouvertes : <span id="footData"></span>. Temps réel IDFM (PRIM), Ilévia et SNCF (GTFS-RT).</p>
        </div>
      </div>
    </div>
    <button class="fab fab-me" id="btnMe" type="button" aria-label="Me recentrer" title="Me recentrer">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="2.6" class="fill"/><path d="M12 1.8v3M12 19.2v3M1.8 12h3M19.2 12h3"/></svg>
    </button>
    <div class="map-msg" id="mapMsg" hidden></div>
  </div>
  <section class="sheet" id="sheet" aria-label="Départs" data-snap="half">
    <div class="busy" id="busy" aria-hidden="true"></div>
    <div class="grip-wrap" id="sheetGrip"><span class="grip" aria-hidden="true"></span></div>
    <div class="sheet-chrome" id="chrome">
      <div class="search" id="searchBox" hidden>
        <label class="search-in">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
          <input id="q" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" placeholder="Où vas-tu ?" aria-label="Où vas-tu ?">
          <button class="search-x" id="qClear" type="button" aria-label="Effacer" hidden><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg></button>
        </label>
        <div class="results" id="qRes" role="listbox"></div>
      </div>
      <div class="status" id="status" hidden></div>
      <div class="filters" id="filters" hidden role="toolbar" aria-label="Filtrer par mode ou par ligne"></div>
    </div>
    <div id="panel" class="panel" aria-live="polite"></div>
  </section>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/core.js"></script>
<script src="/prochain.js"></script>
<script src="/vendor/maplibre/maplibre-gl.js" async onload="window.ondeMapLib&&ondeMapLib()"></script>
</body>
</html>
