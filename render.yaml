# Blueprint Render — Onde 92 (service web Node, plan gratuit)
services:
  - type: web
    name: onde92
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/status
    autoDeploy: true
    envVars:
      - key: PRIM_API_KEY
        sync: false          # à saisir dans le tableau de bord Render, jamais versionnée
      - key: NODE_VERSION
        value: "22"
      - key: GTFS_AUTO_REFRESH
        value: "1"           # reconstruit le GTFS au runtime si > 6 jours ou < 14 jours de calendrier
      - key: PRIM_DAILY_BUDGET
        value: "900"
